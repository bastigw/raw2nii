[workspace]
resolver = "2"
members = ["crates/raw2nii-core", "crates/raw2nii-ge", "crates/raw2nii-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
ndarray = "0.16"
num-complex = "0.4"
thiserror = "2"
tracing = "0.1"
serde_json = "1"
rayon = "1"
tar = "0.4"
zstd = "0.13"
